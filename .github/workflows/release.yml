name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A pull request created with the default GITHUB_TOKEN cannot fire
          # other workflows, so the release PR's required checks never run and
          # auto-merge sits blocked. The SYNC_TOKEN PAT opens the PR as its
          # owner, which triggers CI like any human-opened PR. A fork without
          # the secret falls back to the default token and has to re-trigger
          # the checks by hand (close and reopen the release PR).
          token: ${{ secrets.SYNC_TOKEN || github.token }}
          release-type: simple

  # Pages only gets a new deploy when a release is cut (the release-please PR
  # is merged), not on every push to main.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: |
          npm ci
          npm run lint

      - name: Node test suite (question bank + FSRS)
        run: npm test

      - name: Browser test suite
        run: tests/run-browser.sh

      # tools/stage-site.sh (synced with the engine) curates what ships and
      # is the same staging the CI lighthouse job audits. Never ship the repo
      # wholesale: tests/test.html clears localStorage on load and would wipe
      # the study progress of anyone who opened it on the live origin.
      - name: Stage site files
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: tools/stage-site.sh "$TAG"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      # A deploy that half-fails (stale CDN copy, missing file) is otherwise
      # only found by a user. version.txt is unique per release, so it doubles
      # as the propagation probe; sw.js is checked for the stamped cache name
      # because a stale worker quietly freezes the app at the old version.
      - name: Verify the live site
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          want="${TAG#v}"
          base="${URL%/}"
          got=''
          for i in $(seq 1 30); do
            got=$(curl -fsS "$base/version.txt?probe=$GITHUB_RUN_ID-$i" || true)
            [ "$got" = "$want" ] && break
            sleep 10
          done
          if [ "$got" != "$want" ]; then
            echo "::error::live version.txt is '$got', wanted '$want'"
            exit 1
          fi
          curl -fsS "$base/?probe=$GITHUB_RUN_ID" | grep -q manifest.webmanifest
          curl -fsS "$base/sw.js?probe=$GITHUB_RUN_ID" | grep -q "$want"
          echo "live site serves $want"

      # Ship a signed copy of exactly what went live. These steps run after the
      # deploy on purpose: a signing failure should not cost the site a release.
      - name: Package the deployed site
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir release-assets
          tar -czf "release-assets/${GITHUB_REPOSITORY#*/}-${TAG#v}.tar.gz" -C dist .

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*.tar.gz

      # The Sigstore bundle rides along as a release asset, so a download can be
      # verified with `gh attestation verify` without trusting this workflow.
      - name: Collect the signature bundle
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "release-assets/${GITHUB_REPOSITORY#*/}-${TAG#v}.tar.gz.intoto.jsonl"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-assets

  # Attaching assets needs a write token, so it lives in its own job and the
  # deploy job keeps a read-only one.
  publish-assets:
    needs: [release-please, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: release-assets

      - name: Attach the tarball and its signature to the release
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" release-assets/* --clobber
