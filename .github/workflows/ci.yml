name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary run. Deploys only happen at releases, so this catches
    # runner or Chrome drift before it can block a release.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint
        run: |
          npm ci
          npm run lint

      - name: Node test suite (question bank + FSRS)
        run: npm test

      - name: Browser test suite
        run: tests/run-browser.sh
