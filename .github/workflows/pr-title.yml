name: PR title

# GitHub copies the pull request title into the merge commit, and release-please
# reads the whole message of every commit. A conventionally titled pull request
# therefore lists its one change twice in the changelog, which is how the 1.8.0
# notes ended up with a duplicate entry. Titles here are plain prose; the
# conventional prefixes live on the branch commits.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plain-prose:
    runs-on: ubuntu-latest
    # Both of these are titled by a bot, on purpose, and neither can duplicate a
    # changelog entry: release-please does not merge its own pull request into
    # the next release, and dependabot only ever writes `chore`.
    if: >-
      github.event.pull_request.head.ref != 'release-please--branches--main' &&
      !startsWith(github.event.pull_request.head.ref, 'dependabot/')
    steps:
      - name: Reject a conventional commit prefix
        env:
          # Read through the environment, never interpolated into the script
          # below: the title is attacker controlled on a fork pull request.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test'
          if printf '%s' "$TITLE" | grep -qiE "^($types)(\([^)]*\))?!?:"; then
            echo "::error::Pull request titles must be plain prose, not Conventional Commits."
            echo "Title: $TITLE"
            echo
            echo "GitHub copies this title into the merge commit, where release-please"
            echo "reads it as a second commit and lists the change twice in the changelog."
            echo "Put the prefix on the branch commits instead, and retitle this pull"
            echo "request as a sentence, for example:"
            echo
            echo "  Project an exam readiness score for each test"
            echo
            echo "See the commits and releases section of CONTRIBUTING.md."
            exit 1
          fi
          echo "Title is plain prose: $TITLE"
