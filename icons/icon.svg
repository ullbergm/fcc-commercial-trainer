<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Keep the artwork inside the center 80% so the maskable variant crops safely.
       icon-maskable-512.png is this file rendered with rx="0": the mask shape comes
       from the launcher, so the background must bleed to the edges. -->
  <rect width="512" height="512" rx="96" fill="#0f5e8c"/>
  <!-- lattice mast: a tall triangle sliced into sections by background bars -->
  <path d="M256 152 L206 412 h100 Z" fill="#ffffff"/>
  <rect x="180" y="228" width="152" height="10" fill="#0f5e8c"/>
  <rect x="180" y="292" width="152" height="10" fill="#0f5e8c"/>
  <rect x="180" y="356" width="152" height="10" fill="#0f5e8c"/>
  <!-- radiating waves, two arcs each side, centered on the antenna tip -->
  <path d="M199.4 186.6 A80 80 0 0 1 199.4 73.4" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <path d="M164.1 221.9 A130 130 0 0 1 164.1 38.1" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <path d="M312.6 186.6 A80 80 0 0 0 312.6 73.4" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <path d="M347.9 221.9 A130 130 0 0 0 347.9 38.1" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round"/>
  <!-- antenna tip -->
  <circle cx="256" cy="130" r="24" fill="#f2a032"/>
</svg>
