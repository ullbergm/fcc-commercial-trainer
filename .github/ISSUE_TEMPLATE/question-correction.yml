name: Question correction
description: Report a practice question with a wrong or misleading answer
labels: [question-bank]
body:
  - type: input
    id: question-id
    attributes:
      label: Question ID
      description: The FCC pool number, which is also the id in data/questions.js, like 3-21C4. If you don't know it, paste the question text instead.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong
      description: What the app says, and why you believe it is incorrect.
    validations:
      required: true
  - type: input
    id: manual-page
    attributes:
      label: Pool page
      description: The page of the FCC question pool PDF that shows the question, like 14.
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested fix
      description: What the pool PDF actually says, if it differs from the app.
