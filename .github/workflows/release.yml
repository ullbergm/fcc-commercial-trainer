name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          release-type: simple

  # Pages only gets a new deploy when a release is cut (the release-please PR
  # is merged), not on every push to main.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate question bank
        run: node tests/validate-bank.js

      - name: Run browser test suite
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=8000 --dump-dom "file://$PWD/tests/test.html" \
            2>/dev/null > dom.html
          grep -o 'RESULTS::[^<]*' dom.html | head -1 | tr '|' '\n' | sed '/^$/d' > results.txt
          cat results.txt
          test -s results.txt
          ! grep -qE 'FAIL|EXCEPTION' results.txt

      # Deploy a curated set of app files. Never ship the repo wholesale:
      # tests/test.html clears localStorage on load and would wipe the study
      # progress of anyone who opened it on the live origin.
      - name: Stage site files
        run: |
          mkdir dist
          cp -r index.html css js data CHANGELOG.md CNAME dist/

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
