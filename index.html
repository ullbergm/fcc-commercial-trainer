<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Defense in depth: the app builds its DOM with innerHTML, so if an
       escaping slip ever ships, this keeps injected markup from running
       script or phoning out. 'unsafe-inline' for styles only: the progress
       bar and forecast set style attributes (style-src-attr would be
       cleaner, but older Safari ignores it and would break the bars). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="description" content="Practice questions and spaced-repetition study tool for the North Carolina CDL knowledge tests.">
  <link rel="canonical" href="https://nc-cdl.ullberg.io/">
  <title>NC CDL Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚛</text></svg>">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="theme-color" content="#10684a">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav aria-label="Main">
    <span class="brand">NC CDL Trainer</span>
    <a href="#home" data-view="home" class="active" aria-current="page">Home</a>
    <a href="#study" data-view="study">Study</a>
    <a href="#misses" data-view="misses">Misses</a>
    <a href="#exam" data-view="exam">Exam</a>
    <a href="#browse" data-view="browse">Browse</a>
    <a href="#stats" data-view="stats">Stats</a>
    <a href="#settings" data-view="settings">Settings</a>
    <a href="#about" data-view="about">About</a>
  </nav>
  <main id="view"></main>
  <footer>
    <span id="version"></span>
    <!-- href is filled from the exam config at boot -->
    <a id="repolink" target="_blank" rel="noopener">GitHub</a>
  </footer>
  <script src="data/questions.js"></script>
  <script src="data/manual-pages.js"></script>
  <script src="data/exam-config.js"></script>
  <script src="js/fsrs.js"></script>
  <script src="js/readiness.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
