name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: simple

  # Pages only gets a new deploy when a release is cut (the release-please PR
  # is merged), not on every push to main.
  deploy:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate question bank
        run: node tests/validate-bank.js

      - name: Run browser test suite
        run: |
          google-chrome --headless=new --disable-gpu --no-sandbox \
            --virtual-time-budget=8000 --dump-dom "file://$PWD/tests/test.html" \
            2>/dev/null > dom.html
          grep -o 'RESULTS::[^<]*' dom.html | head -1 | tr '|' '\n' | sed '/^$/d' > results.txt
          cat results.txt
          test -s results.txt
          ! grep -qE 'FAIL|EXCEPTION' results.txt

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
